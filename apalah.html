<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine For You</title>

<style>
body {
    margin: 0;
    padding: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.container {
    text-align: center;
    color: white;
}

.heart {
    font-size: 100px;
    cursor: pointer;
    transition: transform 0.2s;
}

.heart:active {
    transform: scale(1.2);
}

.progress-bar {
    width: 300px;
    height: 20px;
    background: rgba(255,255,255,0.3);
    border-radius: 20px;
    margin: 20px auto;
    overflow: hidden;
}

.progress {
    height: 100%;
    width: 0%;
    background: #ff4d6d;
    transition: width 0.2s;
}

.hidden {
    display: none;
}

button {
    padding: 15px 30px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    margin: 10px;
    transition: 0.2s;
}

#yesBtn {
    background-color: #ff4d6d;
    color: white;
}

#noBtn {
    background-color: #333;
    color: white;
    position: absolute;
}

#card {
    display: none;
    margin-top: 20px;
    background: white;
    padding: 20px;
    border-radius: 15px;
    width: 300px;
    color: black;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    animation: fadeIn 1s ease-in-out;
}

@keyframes fadeIn {
    from {opacity: 0; transform: scale(0.8);}
    to {opacity: 1; transform: scale(1);}
}
</style>
</head>

<body>

<div class="container">

    <!-- LOVE SECTION -->
    <div id="loveSection">
        <div class="heart" id="heart">❤️</div>
        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>
        <p>Tap the love until it's full 💖</p>
    </div>

    <!-- QUESTION SECTION -->
    <div id="questionSection" class="hidden">
        <h1>Will you be my Valentine? 💕</h1>
        <button id="yesBtn">YES 💘</button>
        <button id="noBtn">NO 😏</button>
    </div>

    <!-- CARD -->
    <div id="card">
        <h2>💌 Happy Valentine My Boy 💌</h2>
        <p>
        thank u for coming into my life.<br>
        i hope ur happy and healthy,<br>
        u know i miss you very much rn.<br>
        i miss you so bad :( 
        </p>
    </div>

</div>

<script>
let count = 0;
const maxClick = 15;

const heart = document.getElementById("heart");
const progress = document.getElementById("progress");
const loveSection = document.getElementById("loveSection");
const questionSection = document.getElementById("questionSection");

heart.addEventListener("click", function() {
    count++;
    let percent = (count / maxClick) * 100;
    progress.style.width = percent + "%";

    if (count >= maxClick) {
        loveSection.classList.add("hidden");
        questionSection.classList.remove("hidden");
    }
});

// NO button kabur
const noBtn = document.getElementById("noBtn");

document.addEventListener("mousemove", function(e) {
    const rect = noBtn.getBoundingClientRect();
    const distance = Math.hypot(
        e.clientX - (rect.left + rect.width/2),
        e.clientY - (rect.top + rect.height/2)
    );

    if (distance < 100) {
        const randomX = Math.random() * (window.innerWidth - noBtn.offsetWidth);
        const randomY = Math.random() * (window.innerHeight - noBtn.offsetHeight);
        noBtn.style.left = randomX + "px";
        noBtn.style.top = randomY + "px";
    }
});

// YES button
const yesBtn = document.getElementById("yesBtn");
const card = document.getElementById("card");

yesBtn.addEventListener("click", function() {
    card.style.display = "block";
});
</script>

</body>
</html>
